# Fork-only workflow: build the patched devlake backend image and push it to GHCR.
name: Build-Patched-Image-Push-GHCR
on:
  push:
    branches:
      - patched/*
  workflow_dispatch:

env:
  IMAGE_TAG: v1.0.3-beta15-patched

jobs:
  test:
    name: Unit test patched plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Reuse the Dockerfile builder stage (Go toolchain + libgit2 v1.3.0) as the test environment.
      - name: Build builder stage
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: builder
          load: true
          tags: devlake-builder:local
          cache-from: type=gha,scope=builder
          cache-to: type=gha,scope=builder,mode=max
      - name: Test
        run: |
          docker run --rm -v "$PWD/backend:/app" -w /app \
            -e CGO_ENABLED=1 \
            -e CC=x86_64-linux-gnu-gcc \
            -e PKG_CONFIG_PATH=/usr/local/deps/x86_64/lib/pkgconfig \
            -e LD_LIBRARY_PATH=/usr/local/deps/x86_64/lib \
            devlake-builder:local sh -ec '
              git config --global --add safe.directory /app
              make mock
              go build ./plugins/refdiff/... ./plugins/gitextractor/...
              go test ./plugins/gitextractor/... ./plugins/refdiff/tasks/...
            '

  build-and-push:
    needs: test
    name: Build and push devlake image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af
      - uses: actions/checkout@v4
      - name: Get metadata
        id: meta
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ env.IMAGE_TAG }}
            ${{ steps.meta.outputs.image }}:${{ env.IMAGE_TAG }}-${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            TAG=${{ env.IMAGE_TAG }}
            SHA=${{ steps.meta.outputs.short_sha }}
